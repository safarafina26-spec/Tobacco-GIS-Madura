<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk | TobacoGIS-Madura</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        .tobacco-gradient {
            background: linear-gradient(135deg, #1b4332 0%, #081c15 100%);
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 relative overflow-hidden font-sans">
    <!-- Background Glow Effects -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-emerald-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-green-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md z-10">
        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <div class="inline-flex w-16 h-16 rounded-2xl bg-emerald-500/20 border border-emerald-400/30 items-center justify-center text-emerald-400 mb-3 shadow-lg shadow-emerald-950/50">
                <i class="fa-solid fa-leaf text-3xl"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-white tracking-tight">TobacoGIS-Madura</h1>
            <p class="text-xs text-emerald-300/80 mt-1">Sistem Informasi Spasial Integrasi & Transmisi Harga Tembakau</p>
        </div>

        <!-- Login Card -->
        <div class="bg-slate-800/80 backdrop-blur-xl border border-slate-700 rounded-2xl p-7 shadow-2xl shadow-black/60">
            <div class="flex items-center justify-between pb-4 border-b border-slate-700/80 mb-6">
                <div>
                    <h2 class="text-lg font-bold text-white">Autentikasi Pengguna</h2>
                    <p class="text-xs text-slate-400">Silakan login untuk mengakses dasbor spasial</p>
                </div>
                <div class="px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[10px] font-semibold uppercase tracking-wider">
                    Secure GIS
                </div>
            </div>

            <!-- Error alert -->
            <div id="errorAlert" class="hidden mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation text-rose-400 text-sm"></i>
                <span id="errorMessage">Username atau password tidak sesuai.</span>
            </div>

            <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5" for="username">
                        Username / ID Petugas
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 text-sm">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="username" required
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-white text-sm placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition"
                            placeholder="admin / operator / peneliti">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5" for="password">
                        Kata Sandi
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 text-sm">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" required
                            class="w-full pl-10 pr-10 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-white text-sm placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition"
                            placeholder="••••••••">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-white transition">
                            <i id="toggleIcon" class="fa-regular fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs pt-1">
                    <label class="flex items-center text-slate-400 cursor-pointer">
                        <input type="checkbox" id="remember" class="w-3.5 h-3.5 rounded border-slate-700 text-emerald-600 focus:ring-0 bg-slate-900">
                        <span class="ml-2">Ingat saya</span>
                    </label>
                    <a href="javascript:void(0)" onclick="alert('Silakan hubungi administrator atau gunakan kredensial demo di bawah.')" class="text-emerald-400 hover:underline">Bantuan login?</a>
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full mt-2 py-2.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl text-sm shadow-lg shadow-emerald-700/30 transition duration-150 flex items-center justify-center gap-2">
                    <span>Masuk ke Sistem GIS</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <!-- Demo Credentials Helper -->
            <div class="mt-6 pt-5 border-t border-slate-700/60">
                <p class="text-[11px] font-semibold text-slate-400 mb-2 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-key text-emerald-400"></i> Akun Demo Tersedia:
                </p>
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" onclick="fillCredential('admin', 'admin123')"
                        class="px-2 py-1.5 bg-slate-900/80 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-[11px] text-center transition">
                        <div class="font-bold text-emerald-400">Admin</div>
                        <div class="text-[10px] text-slate-400">admin123</div>
                    </button>
                    <button type="button" onclick="fillCredential('operator', 'operator123')"
                        class="px-2 py-1.5 bg-slate-900/80 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-[11px] text-center transition">
                        <div class="font-bold text-amber-400">Operator</div>
                        <div class="text-[10px] text-slate-400">operator123</div>
                    </button>
                    <button type="button" onclick="fillCredential('peneliti', 'peneliti123')"
                        class="px-2 py-1.5 bg-slate-900/80 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-[11px] text-center transition">
                        <div class="font-bold text-sky-400">Peneliti</div>
                        <div class="text-[10px] text-slate-400">peneliti123</div>
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6 text-xs text-slate-500">
            &copy; 2024 TobacoGIS-Madura &bull; Sentra Agribisnis Tembakau Pamekasan
        </div>
    </div>

    <script>
        function fillCredential(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
            hideError();
        }

        function togglePasswordVisibility() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.className = 'fa-regular fa-eye-slash text-sm';
            } else {
                pwd.type = 'password';
                icon.className = 'fa-regular fa-eye text-sm';
            }
        }

        function showError(msg) {
            const alertBox = document.getElementById('errorAlert');
            document.getElementById('errorMessage').innerText = msg;
            alertBox.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('errorAlert').classList.add('hidden');
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideError();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Memverifikasi...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    window.location.href = '/';
                } else {
                    showError(data.detail || 'Username atau password salah.');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Masuk ke Sistem GIS</span> <i class="fa-solid fa-arrow-right text-xs"></i>';
                }
            } catch (err) {
                showError('Terjadi kesalahan jaringan atau server tidak merespon.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Masuk ke Sistem GIS</span> <i class="fa-solid fa-arrow-right text-xs"></i>';
            }
        }
    </script>
</body>
</html>
